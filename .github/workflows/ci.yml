name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm turbo run test --ui=stream

  content:
    name: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Read-only deploy key on the private ProGrads-content repo. actions/checkout can't place
      # a checkout outside $GITHUB_WORKSPACE, so this lands at ./content-repo (not the
      # ../ProGrads-content sibling path local dev / root package.json scripts use — this job
      # calls prettier/markdownlint/validate directly instead of pnpm content:check).
      - uses: actions/checkout@v7
        with:
          repository: yPinn/ProGrads-content
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: content-repo

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # validate-questions needs the QuestionFrontmatter Zod schema built (packages/db's seed
      # files are read as plain text, no build/generate needed — see seed-refs.ts).
      - name: Build shared
        run: pnpm --filter @prograds/shared build

      - name: Format (content repo)
        run: pnpm exec prettier --check content-repo && pnpm exec markdownlint-cli2 "content-repo/**/*.md"

      - name: Validate questions
        run: pnpm --filter @prograds/content-sync validate-questions content-repo/questions

      - name: Validate admissions
        run: pnpm --filter @prograds/content-sync validate-admissions content-repo/admissions

      - name: Validate admission-stats
        run: pnpm --filter @prograds/content-sync validate-admission-stats content-repo/admission-stats

      - name: Validate faculty
        run: pnpm --filter @prograds/content-sync validate-faculty content-repo/faculty
