name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm turbo run test --ui=stream

  content:
    name: content
    runs-on: ubuntu-latest
    # Dependabot-triggered runs use a separate secrets context that doesn't carry
    # CONTENT_DEPLOY_KEY, so the checkout below always 404s for them — skip rather
    # than show a permanent false-red on every dependency PR.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      # Read-only deploy key on the private ProGrads-content repo. actions/checkout can't place
      # a checkout outside $GITHUB_WORKSPACE, so this lands at ./content-repo (not the
      # ../ProGrads-content sibling path local dev / root package.json scripts use — this job
      # calls prettier/markdownlint/validate directly instead of pnpm content:check).
      - uses: actions/checkout@v7
        with:
          repository: yPinn/ProGrads-content
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: content-repo

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # validate-questions needs the QuestionFrontmatter Zod schema built (packages/db's seed
      # files are read as plain text, no build/generate needed — see seed-refs.ts).
      - name: Build shared
        run: pnpm --filter @prograds/shared build

      - name: Format (content repo)
        run: pnpm exec prettier --check content-repo && pnpm exec markdownlint-cli2 "content-repo/**/*.md"

      - name: Validate questions
        run: pnpm --filter @prograds/content-sync validate-questions content-repo/questions

      - name: Validate admissions
        run: pnpm --filter @prograds/content-sync validate-admissions content-repo/admissions

      - name: Validate admission-stats
        run: pnpm --filter @prograds/content-sync validate-admission-stats content-repo/admission-stats

      - name: Validate faculty
        run: pnpm --filter @prograds/content-sync validate-faculty content-repo/faculty

  deploy-web:
    name: Deploy Web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, test, content]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://prograds.pages.dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Pages bundle
        env:
          NUXT_PUBLIC_SITE_URL: https://prograds.pages.dev
          NUXT_PUBLIC_API_BASE_URL: https://prograds-api.llazypilot.com/api/v1
        run: pnpm --filter '@prograds/web...' build

      - name: Publish to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "Skipping deployment because main has advanced."
            exit 0
          fi

          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in the production environment}"
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in the production environment}"
          npx --yes wrangler@4.157.0 pages deploy apps/web/dist \
            --project-name prograds --branch main --commit-hash "$GITHUB_SHA"
